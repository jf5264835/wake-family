name: Deploy development

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop
    types:
      - closed

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wake-family-development
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jf5264835/wake-family

jobs:
  deploy:
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true

    name: Build and deploy development
    runs-on: ubuntu-latest

    environment:
      name: development

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish development image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jf5264835/wake-family
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy development
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
        run: |
          ssh_port="${DEV_SSH_PORT:-22}"

          ssh \
            -p "$ssh_port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$DEV_USER@$DEV_HOST" \
            "deploy $GITHUB_SHA"
