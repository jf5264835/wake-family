name: Deploy development

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: wake-family-development
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jf5264835/wake-family

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.DEV_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Verify
        run: |
          npm ci
          npm run lint
          npm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jf5264835/wake-family
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEV_HOST: ${{ vars.DEV_HOST }}
          DEV_USER: ${{ vars.DEV_USER }}
        run: |
          ssh "$DEV_USER@$DEV_HOST" "deploy $GITHUB_SHA"

      - name: Verify deployment
        env:
          DEV_URL: ${{ vars.DEV_URL }}
        run: |
          curl --fail \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            "$DEV_URL/"
